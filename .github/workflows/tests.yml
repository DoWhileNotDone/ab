name: Tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: interview
          MYSQL_USER: interview
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: interview
      DB_USERNAME: interview
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies
        run: composer audit
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run database migrations
        run: php artisan migrate --force
      - name: Check PHP coding standards
        run: composer lint
      - name: Run static analysis
        run: composer analyse
      - name: Prepare coverage output directory
        run: mkdir -p build/coverage
      - name: Run unit tests with coverage
        run: php artisan test --testsuite=Unit --coverage --min=5 --coverage-clover=build/coverage/unit.xml --coverage-html=build/coverage/unit-html
      - name: Run functional tests with coverage
        run: php artisan test --testsuite=Feature --coverage --min=5 --coverage-clover=build/coverage/functional.xml --coverage-html=build/coverage/functional-html
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: php-coverage
          path: build/coverage/
          if-no-files-found: warn
          retention-days: 14
