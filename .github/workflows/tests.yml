name: Tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start Docker Compose services
        run: docker compose up --build -d
      - name: Install dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist
      - name: Audit dependencies
        run: docker compose exec -T app composer audit
      - name: Prepare application
        run: |
          cp .env.example .env
          docker compose exec -T app php artisan key:generate --force
      - name: Run database migrations
        run: docker compose exec -T app php artisan migrate --force
      - name: Check PHP coding standards
        run: docker compose exec -T app composer lint
      - name: Run static analysis
        run: docker compose exec -T app composer analyse
      - name: Prepare coverage output directory
        run: mkdir -p build/coverage
      - name: Run feature tests with coverage
        run: docker compose exec -T app php artisan test --testsuite=Feature --coverage --min=5 --coverage-clover=build/coverage/functional.xml --coverage-html=build/coverage/functional-html
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: php-coverage
          path: build/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down --remove-orphans
